name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching Cargo.toml and debian/changelog (vX.Y.Z)"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Validate tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          if [[ -z "$tag" ]]; then
            echo "A release tag is required" >&2
            exit 1
          fi

          case "$tag" in
            v*) version="${tag#v}" ;;
            *) version="$tag" ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          deb_version="$(sed -n 's/^rustdesk-server (\([^)]*\)).*/\1/p' debian/changelog | head -n 1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Release version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if [[ "$version" != "$deb_version" ]]; then
            echo "Release version $version does not match debian/changelog version $deb_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux amd64
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux binaries
        run: cargo build --locked --release --all-features --bin hbbs --bin hbbr --bin rustdesk-utils

      - name: Check binary outputs
        run: |
          set -euo pipefail
          chmod -v a+x target/release/{hbbs,hbbr,rustdesk-utils}
          file target/release/{hbbs,hbbr,rustdesk-utils}

      - name: Publish Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: |
            target/release/hbbr
            target/release/hbbs
            target/release/rustdesk-utils
          if-no-files-found: error

  package-binary:
    name: Package Linux binary
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: input

      - name: Create Linux archive
        shell: bash
        run: |
          set -euo pipefail
          test -f input/hbbs
          test -f input/hbbr
          test -f input/rustdesk-utils
          mkdir -p release-assets
          tar -C input -czf "release-assets/rustdesk-server-linux-amd64-${{ needs.prepare.outputs.tag }}.tar.gz" hbbs hbbr rustdesk-utils

      - name: Publish Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-linux-amd64
          path: release-assets/*.tar.gz
          if-no-files-found: error

  deb-package:
    name: Build Debian packages amd64
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends devscripts build-essential debhelper pkg-config
          mkdir -p debian-build/amd64/bin

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: debian-build/amd64/bin

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          chmod -v a+x debian-build/amd64/bin/*
          cp -vr debian systemd debian-build/amd64/
          sed 's/{{ ARCH }}/amd64/' debian/control.tpl > debian-build/amd64/debian/control
          cd debian-build/amd64/
          debuild -i -us -uc -b -aamd64

      - name: Publish Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: release-deb-amd64
          path: |
            debian-build/rustdesk-server-hbbr_*_amd64.deb
            debian-build/rustdesk-server-hbbs_*_amd64.deb
            debian-build/rustdesk-server-utils_*_amd64.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - package-binary
      - deb-package
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -print -quit)"
          (cd release-assets && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)) > release-assets/SHA256SUMS
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RustDesk Server ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
