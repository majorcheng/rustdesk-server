name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.17"
        required: true
        default: "v1.1.17"
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Validate tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          if [[ -z "$tag" ]]; then
            echo "A release tag is required" >&2
            exit 1
          fi

          case "$tag" in
            v*) version="${tag#v}" ;;
            *) version="$tag" ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          deb_version="$(sed -n 's/^rustdesk-server (\([^)]*\)).*/\1/p' debian/changelog | head -n 1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Release version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if [[ "$version" != "$deb_version" ]]; then
            echo "Release version $version does not match debian/changelog version $deb_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux - ${{ matrix.job.name }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386",    target: "i686-unknown-linux-musl" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: ${{ matrix.job.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --release --all-features --target=${{ matrix.job.target }}
          use-cross: true

      - name: Check binary outputs
        run: |
          set -euo pipefail
          chmod -v a+x target/${{ matrix.job.target }}/release/{hbbs,hbbr,rustdesk-utils}
          file target/${{ matrix.job.target }}/release/{hbbs,hbbr,rustdesk-utils}

      - name: Publish Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error

  build-win:
    name: Build Windows
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: x86_64-pc-windows-msvc

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --release --all-features --target=x86_64-pc-windows-msvc
          use-cross: true

      - name: Install NSIS
        shell: powershell
        run: |
          iwr -useb get.scoop.sh -outfile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          scoop update
          scoop bucket add extras
          scoop install nsis

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Build UI browser file
        run: |
          npm i
          npm run build
        working-directory: ./ui/html

      - name: Build UI setup file
        shell: cmd
        run: |
          rustup default nightly
          cargo build --release
          xcopy /y ..\target\x86_64-pc-windows-msvc\release\*.exe setup\bin\
          xcopy /y target\release\*.exe setup\
          mkdir setup\logs
          makensis /V1 setup.nsi
          mkdir SignOutput
          move RustDeskServer.Setup.exe SignOutput\
          move ..\target\x86_64-pc-windows-msvc\release\*.exe SignOutput\
        working-directory: ./ui

      - name: Publish Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: |
            ui\SignOutput\hbbr.exe
            ui\SignOutput\hbbs.exe
            ui\SignOutput\rustdesk-utils.exe
            ui\SignOutput\RustDeskServer.Setup.exe
          if-no-files-found: error

  package-binaries:
    name: Package ${{ matrix.job.os }} - ${{ matrix.job.name }}
    needs:
      - prepare
      - build
      - build-win
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: "linux",   name: "amd64",   suffix: "" }
          - { os: "linux",   name: "arm64v8", suffix: "" }
          - { os: "linux",   name: "armv7",   suffix: "" }
          - { os: "linux",   name: "i386",    suffix: "" }
          - { os: "windows", name: "x86_64",  suffix: "-unsigned" }

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.job.os }}-${{ matrix.job.name }}
          path: input

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod -v a+x input/*
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends zip
          mkdir -p release-assets
          zip -j "release-assets/rustdesk-server-${{ matrix.job.os }}-${{ matrix.job.name }}${{ matrix.job.suffix }}-${{ needs.prepare.outputs.tag }}.zip" input/*

      - name: Publish binary archive
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.job.os }}-${{ matrix.job.name }}
          path: release-assets/*.zip
          if-no-files-found: error

  deb-package:
    name: Build Debian package - ${{ matrix.job.name }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   debian_platform: "amd64", crossbuild_package: "" }
          - { name: "arm64v8", debian_platform: "arm64", crossbuild_package: "crossbuild-essential-arm64" }
          - { name: "armv7",   debian_platform: "armhf", crossbuild_package: "crossbuild-essential-armhf" }
          - { name: "i386",    debian_platform: "i386",  crossbuild_package: "crossbuild-essential-i386" }

    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p debian-build/${{ matrix.job.name }}/bin

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: debian-build/${{ matrix.job.name }}/bin

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          chmod -v a+x debian-build/${{ matrix.job.name }}/bin/*
          cp -vr debian systemd debian-build/${{ matrix.job.name }}/
          sed 's/{{ ARCH }}/${{ matrix.job.debian_platform }}/' debian/control.tpl > debian-build/${{ matrix.job.name }}/debian/control
          cd debian-build/${{ matrix.job.name }}/
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform }}

      - name: Publish Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: release-deb-${{ matrix.job.name }}
          path: |
            debian-build/rustdesk-server-hbbr_*_${{ matrix.job.debian_platform }}.deb
            debian-build/rustdesk-server-hbbs_*_${{ matrix.job.debian_platform }}.deb
            debian-build/rustdesk-server-utils_*_${{ matrix.job.debian_platform }}.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - package-binaries
      - deb-package
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -print -quit)"
          sha256sum release-assets/* > release-assets/SHA256SUMS
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RustDesk Server ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
